[package]
name = "clickhouse-migrator"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
clickhouse-rs = "1.1.0-alpha.1" 
bollard = "0.15"
winapi = { version = "0.3.9", features = ["winerror", "minwindef", "ntstatus"] }
clickhouse = {version = "0.14.2", features = ["lz4", "test-util"]}
serde_json = "1.0"
serde = "1.0.228"
futures-util = "0.3.32"
tokio-util = "0.7.18"
env_logger = "0.11.9"
log = "0.4.29"
indicatif = "0.18.4"
